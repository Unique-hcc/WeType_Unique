name: Build patched WeType

# 触发：
#   1) Actions -> Run workflow（可指定模块资产名 / versionCode 加值 / 是否发 Release）
#   2) 任意 issue 评论 /build（手机上最顺手，仅仓库所有者生效）
#   3) 本仓库发布 Release（即上传新模块）-> 立刻自动打包并发布 Release
#   4) 每周一 03:00（北京时间）自动检测，版本没变则跳过打包
on:
  workflow_dispatch:
    inputs:
      module_asset:
        description: "指定模块 Release 资产名（留空 = 自动取体积最小的 .apk）"
        type: string
        required: false
      version_code_bump:
        description: "versionCode 额外加值（同版本想覆盖安装时用，默认 0）"
        type: string
        default: "0"
      force:
        description: "忽略缓存，强制重下官方包"
        type: boolean
        default: false
      publish_release:
        description: "构建成功后创建 Release 并上传产物（公开仓库会公开分发，谨慎勾选）"
        type: boolean
        default: false
  issue_comment:
    types: [created]
  # 本仓库一发 Release（也就是你上传了新模块）就立刻跑一次
  release:
    types: [published]
  # GitHub 的 cron 是 UTC：0 19 * * 0 = 北京时间每周一 03:00
  schedule:
    - cron: "0 19 * * 0"

concurrency:
  group: patch-wetype
  cancel-in-progress: false

env:
  MODULE_REPO: Unique-hcc/WeType_Unique
  APP_LABEL: 微信输入法
  OUTPUT_PREFIX: 微信输入法
  MODULE_VERSION_PREFIX: V

jobs:
  build:
    # 1) issue 评论触发：必须是本仓库所有者发的 /build
    # 2) Release 触发：用 body 里的标记识别「这是本流水线自己发的版」，避免自触发死循环
    #    （不能按 tag 前缀判断：你的模块 tag 也是 WeType_ 开头）
    if: |
      (github.event_name != 'issue_comment' ||
        (contains(github.event.comment.body, '/build') &&
         github.event.comment.user.login == github.repository_owner)) &&
      (github.event_name != 'release' ||
        (!contains(github.event.release.body, 'auto-generated by wetype-patch') &&
         github.event.release.prerelease == false))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write   # 勾了 publish_release 时要建 Release / 传附件

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ---------- 1. 官方最新版（每次运行都重新解析，不写死版本） ----------
      - name: Resolve latest official WeType
        id: resolve
        run: python3 builder/scripts/resolve_apk.py

      # ---------- 2. 模块仓库最新 Release 里的模块 APK ----------
      # release 事件下，如果资产是「先建 release 再传文件」，published 那一刻可能还没传完，等一会
      - name: Wait for module assets
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 12); do
            CNT=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | python3 -c "import json,sys;print(len([a for a in json.load(sys.stdin).get('assets',[]) if a['name'].lower().endswith('.apk')]))")
            echo "第 ${i} 次检查：latest release 里有 ${CNT} 个 .apk"
            if [ "$CNT" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "::error::等待 60 秒后 latest release 里仍然没有 .apk 资产"
          exit 1

      - name: Resolve latest module
        id: module
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODULE_ASSET: ${{ inputs.module_asset }}
        run: python3 builder/scripts/pick_module.py

      # ---------- 2.5 定时任务的去重：版本没变就直接跳过，不再下载/打包 ----------
      # state 存在 actions/cache 里，键名带 run_id（每次都新写一份），restore 时取最近一份
      - name: Restore build state
        id: state
        uses: actions/cache@v4
        with:
          path: .state
          key: wetype-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            wetype-state-

      - name: Check duplicate build
        id: dup
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          KEY="${{ steps.resolve.outputs.version }}.${{ steps.resolve.outputs.build }}_V${{ steps.module.outputs.version }}"
          LAST=$(cat .state/last.txt 2>/dev/null || echo "")
          echo "上次构建：${LAST:-（无）}"
          echo "本次目标：$KEY"
          if [ -n "$LAST" ] && [ "$LAST" = "$KEY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::定时任务：微信输入法 ${KEY} 与模块版本都未变化，跳过本次打包"
            echo "### 跳过：版本未变化（$KEY）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "::notice::版本有变化：${LAST:-（无）} -> $KEY，开始打包"
          fi

      # ---------- 3. 官方包缓存（键用官网路径版本 + 构建号） ----------
      - name: Cache official APK
        id: cache-apk
        if: ${{ steps.dup.outputs.skip != 'true' && !inputs.force }}
        uses: actions/cache@v4
        with:
          path: .cache
          key: wetype-${{ steps.resolve.outputs.version }}-${{ steps.resolve.outputs.build }}

      - name: Download official APK
        if: ${{ steps.dup.outputs.skip != 'true' && steps.cache-apk.outputs.cache-hit != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          curl -L --fail --retry 5 --retry-delay 10 -C - \
            -A "Mozilla/5.0 (Linux; Android 13)" \
            -o ".cache/${{ steps.resolve.outputs.filename }}" \
            "${{ steps.resolve.outputs.url }}"
          ls -lh .cache

      # ---------- 3.5 从包内清单读真实版本（文件名里的数字是构建号，不是 versionCode） ----------
      - name: Read real version from manifest
        id: apkinfo
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          APK=$(ls .cache/*.apk | head -1)
          python3 builder/scripts/apk_info.py "$APK"
          echo "上述 versioncode 才是真值，官网文件名里的 ${{ steps.resolve.outputs.build }} 仅是构建号"

      # ---------- 4. LSPatch 命令行打补丁器 ----------
      - name: Fetch lspatch.jar
        if: ${{ steps.dup.outputs.skip != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          URL=$(curl -sL -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/JingMatrix/LSPatch/releases/latest \
            | python3 -c "import json,sys;d=json.load(sys.stdin);a=[x['browser_download_url'] for x in d['assets'] if x['name'].endswith('.jar') and 'debug' not in x['name']];print(a[0])")
          echo "lspatch: $URL"
          curl -L --fail -o lspatch.jar "$URL"

      # ---------- 5. 模块下载 ----------
      - name: Download module APK
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o module.apk "${{ steps.module.outputs.url }}"
          ls -lh module.apk

      # 防呆：LSPatch 遇到无效模块只打印一行 "not a valid apk" 然后静默跳过，
      # 产物看着成功、实际没内置，所以这里提前硬校验，宁可失败也别出个假包
      - name: Validate module APK
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, zipfile
          try:
              z = zipfile.ZipFile("module.apk")
          except Exception as e:
              sys.exit(f"module.apk 打不开：{e}")
          names = z.namelist()
          # 现代 libxposed 模块：META-INF/xposed/ 下放 module.prop、java_init.list 等
          legacy = any(n in ("assets/xposed_init",) or n.endswith("assets/xposed_init") for n in names)
          modern = [n for n in names if n.startswith("META-INF/xposed/")]
          print(f"条目数={len(names)} legacy_xposed_init={legacy} modern={modern}")
          if not (legacy or modern):
              sys.exit("下载到的 APK 里没有 Xposed 模块声明（META-INF/xposed/ 或 assets/xposed_init），"
                       "不是可内置的模块包")
          print("模块校验通过")
          PY

      - name: Ensure module version matches
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          # 资产体积和版本号对不上时提醒（模块约 6MB，整包 200MB+）
          SIZE=$(stat -c %s module.apk)
          echo "module.apk = $((SIZE / 1048576)) MB, 模块版本 = ${{ steps.module.outputs.version }}"
          [ "$SIZE" -lt 52428800 ] || { echo "::error::module.apk 超过 50MB，不像是模块本体"; exit 1; }

      # ---------- 6. BKS 转 PKCS12（LSPatch 只认 JVM 默认的 PKCS12） ----------
      # 三个 Secret 缺失时这里会明确报错，而不是丢一个 EOFException 让人猜
      - name: Convert keystore
        if: ${{ steps.dup.outputs.skip != 'true' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          # 只用来诊断「是不是误加到了 Variables 页签」，绝不打印值
          VAR_KEYSTORE_B64: ${{ vars.KEYSTORE_B64 }}
          VAR_KEYSTORE_PASS: ${{ vars.KEYSTORE_PASS }}
          VAR_KEY_ALIAS: ${{ vars.KEY_ALIAS }}
        run: |
          set -euo pipefail

          echo "本次运行代码版本：${GITHUB_SHA}"
          echo "| Secret | 状态 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "| KEYSTORE_B64 | 已配置（${#KEYSTORE_B64} 字符） |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| KEYSTORE_B64 | **缺失** |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${KEYSTORE_PASS:-}" ]; then
            echo "| KEYSTORE_PASS | 已配置 |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| KEYSTORE_PASS | **缺失** |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${KEY_ALIAS:-}" ]; then
            echo "| KEY_ALIAS | 已配置（$KEY_ALIAS） |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| KEY_ALIAS | **缺失** |" >> "$GITHUB_STEP_SUMMARY"
          fi

          missing=()
          [ -n "${KEYSTORE_B64:-}" ]  || missing+=("KEYSTORE_B64")
          [ -n "${KEYSTORE_PASS:-}" ] || missing+=("KEYSTORE_PASS")
          [ -n "${KEY_ALIAS:-}" ]     || missing+=("KEY_ALIAS")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::缺少 Secret：${missing[*]}（当前为空）"
            if [ -n "${VAR_KEYSTORE_B64:-}${VAR_KEYSTORE_PASS:-}${VAR_KEY_ALIAS:-}" ]; then
              echo "::error::检测到 Variables 里有同名变量，但流水线读的是 Secrets —— 请把 Variables 里的同名项删掉，改加到 Secrets 页签"
            fi
            cat <<'MSG'
          ┌─ 怎么修 ─────────────────────────────────────────────┐
          │ 仓库页 → Settings → Secrets and variables → Actions  │
          │ → 选 Secrets 页签 → New repository secret            │
          │   KEYSTORE_B64   = base64 -w0 Unique.bks 的整段输出  │
          │   KEYSTORE_PASS  = BKS 的口令                        │
          │   KEY_ALIAS      = unique                            │
          │ 注意：不是 Variables 页签；不是 Environment secret；  │
          │       名字大小写要完全一致                            │
          └──────────────────────────────────────────────────────┘
          MSG
            exit 1
          fi

          # 去掉粘贴时带的换行/空格/CR，否则 base64 会解出残包
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n \t' | base64 -d > official.bks

          SIZE=$(stat -c %s official.bks)
          echo "official.bks = ${SIZE} bytes"
          if [ "$SIZE" -lt 100 ]; then
            echo "::error::解出来只有 ${SIZE} 字节，base64 内容不完整或被截断"
            echo "::error::请用 Git Bash 执行 base64 -w0 Unique.bks 后整段粘贴；不要用 certutil（它会加 BEGIN/END 头）"
            exit 1
          fi
          HEAD=$(head -c 4 official.bks | od -An -tx1 | tr -d ' \n')
          echo "文件头 = $HEAD"
          if [ "$HEAD" != "00000002" ]; then
            echo "::error::文件头不是 BKS v2 的 00 00 00 02，这个不是有效的 BKS 密钥库"
            exit 1
          fi

          curl -sL --fail -o bcprov.jar \
            https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar
          mkdir -p builder/tools/build
          javac -cp bcprov.jar -d builder/tools/build builder/tools/BksToP12.java
          java -cp "bcprov.jar:builder/tools/build" BksToP12 \
            official.bks "$KEYSTORE_PASS" "$KEY_ALIAS" sign.p12 "$KEYSTORE_PASS"
          rm -f official.bks

      # ---------- 7. 内置模块 + 补权限 + 重签名 ----------
      # -m   内置(集成)模式，模块烤进 APK，不依赖管理器
      # -l 2 签名绕过（pm+openat），腾讯系从 2 起
      # -k   4 个参数：keystore / ks 密码 / alias / key 密码
      # --add-permission 裸名会自动补 android.permission. 前缀
      # --version-code 必须用清单里的真值（59201），用构建号会变成降级安装
      - name: Patch, inject permission and sign
        if: ${{ steps.dup.outputs.skip != 'true' }}
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=$(ls .cache/*.apk | head -1)
          VC="${{ steps.apkinfo.outputs.versioncode }}"
          BUMP="${{ inputs.version_code_bump }}"
          [ -n "$VC" ] || { echo "没读到 versionCode"; exit 1; }
          if [ -n "${BUMP:-}" ] && [ "${BUMP}" != "0" ]; then VC=$((VC + BUMP)); fi
          echo "target versionCode=$VC"

          mkdir -p dist
          java -jar lspatch.jar "$APK" \
            -m module.apk \
            -o dist -f -v \
            -l 2 \
            -k sign.p12 "$KEYSTORE_PASS" "$KEY_ALIAS" "$KEYSTORE_PASS" \
            --add-permission QUERY_ALL_PACKAGES \
            --name "$APP_LABEL" \
            --version-code "$VC" 2>&1 | tee patch.log

          # LSPatch 遇到无效模块只打印一行就继续，产物看着正常但没内置 —— 这里必须拦下来
          if grep -q "not a valid apk" patch.log; then
            echo "::error::LSPatch 报告模块无效（module.apk ... not a valid apk），本次没有内置成功"
            exit 1
          fi
          grep -q "Embedding modules" patch.log || { echo "::error::日志里没有 Embedding modules，模块可能没进去"; exit 1; }
          echo "模块已内置"

      # ---------- 8. 命名：微信输入法_<输入法完整版本>_V<模块版本>.apk ----------
      # 输入法版本取清单的 versionName(.versionCode)，对应手机设置里看到的 4.0.1.59201
      - name: Rename output
        id: rename
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          RAW=$(ls dist/*.apk | head -1)
          NAME="${OUTPUT_PREFIX}_${{ steps.apkinfo.outputs.app_version }}_${MODULE_VERSION_PREFIX}${{ steps.module.outputs.version }}.apk"
          mkdir -p release
          mv "$RAW" "release/$NAME"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "release/$NAME"

      # ---------- 9. 校验内容与版本 ----------
      - name: Verify content
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          F="release/${{ steps.rename.outputs.file }}"
          sha256sum "$F"
          unzip -l "$F" | grep -i 'assets/lspatch' | head -8
          echo "--- 产物版本（必须与官方包一致，否则装不上） ---"
          python3 builder/scripts/apk_info.py "$F"
          WANT="${{ steps.apkinfo.outputs.versioncode }}"
          BUMP="${{ inputs.version_code_bump }}"
          if [ -n "${BUMP:-}" ] && [ "${BUMP}" != "0" ]; then WANT=$((WANT + BUMP)); fi
          GOT=$(python3 builder/scripts/apk_info.py "$F" --json | python3 -c "import json,sys;print(json.load(sys.stdin)['versioncode'])")
          [ "$GOT" = "$WANT" ] || { echo "versionCode 不一致: got=$GOT want=$WANT"; exit 1; }
          echo "versionCode ok ($GOT)"
          python3 - "$F" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = z.namelist()
              mods = [n for n in names if n.startswith("assets/lspatch/modules/")]
              print("embedded modules:", mods)
              assert mods, "没有内置模块"
              raw = z.read("AndroidManifest.xml")
          text = raw.decode("utf-8", "ignore")
          print("QUERY_ALL_PACKAGES:", "QUERY_ALL_PACKAGES" in text)
          assert "QUERY_ALL_PACKAGES" in text, "权限没写进 manifest"
          PY

      - name: Verify signature
        if: ${{ steps.dup.outputs.skip != 'true' }}
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p builder/tools/build
          javac -cp lspatch.jar -d builder/tools/build builder/tools/VerifyApk.java
          EXPECT=$(keytool -exportcert -keystore sign.p12 -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASS" 2>/dev/null \
            | sha256sum | cut -d' ' -f1 | tr 'a-f' 'A-F')
          echo "expected cert sha256: $EXPECT"
          java -cp "lspatch.jar:builder/tools/build" VerifyApk "release/${{ steps.rename.outputs.file }}" "$EXPECT"

      - name: Upload artifact
        if: ${{ steps.dup.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: WeType-patched-${{ steps.apkinfo.outputs.app_version }}-${{ steps.module.outputs.version }}
          path: release/*.apk
          retention-days: 2
          compression-level: 0

      # ---------- 10. 决定这次要不要发 Release ----------
      #   release 事件（你上传了新模块）→ 默认发
      #   手动 dispatch            → 看 publish_release 勾没勾
      #   定时 / issue 评论         → 不发，只留 artifact
      - name: Decide publish
        id: pub
        if: ${{ steps.dup.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
            echo "::notice::由模块 Release「${{ github.event.release.tag_name }}」触发，构建成功后自动发布 Release"
          elif [ "${{ inputs.publish_release }}" = "true" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
            echo "::notice::手动运行且勾选了 publish_release，构建成功后发 Release"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::只出 artifact，不发 Release"
          fi

      # ---------- 11. 发到 Releases ----------
      - name: Publish to Releases
        if: ${{ steps.pub.outputs.on == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          F="release/${{ steps.rename.outputs.file }}"
          TAG="WeType_${{ steps.apkinfo.outputs.app_version }}_V${{ steps.module.outputs.version }}"
          # GitHub 会把 asset 名里的中文吃掉（微信输入法_4.0.1.59201_V1.29.0.apk -> _4.0.1.59201_V1.29.0.apk），
          # 所以上传附件时改用与 tag 同名的 ASCII 文件名；Actions artifact 里仍是中文名。
          ASSET="$TAG.apk"
          cp "$F" "release/$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传"
            gh release upload "$TAG" "release/$ASSET" --clobber
            # 清掉同 Release 里其它 .apk（例如命名规则变更前留下的旧资产），避免一版挂两个包
            gh release view "$TAG" --json assets -q '.assets[].name' | while read -r n; do
              case "$n" in
                "$ASSET") ;;
                *.apk) echo "删除多余资产：$n"; gh release delete-asset "$TAG" "$n" -y ;;
              esac
            done
          else
            NOTES=$(printf '%s\n' \
              "<!-- auto-generated by wetype-patch：本版由 Actions 自动构建，勿修改此说明 -->" \
              "内置模块：WeType_Unique ${{ steps.module.outputs.version }}" \
              "官方底包：微信输入法 ${{ steps.resolve.outputs.version }}（versionCode ${{ steps.apkinfo.outputs.versioncode }}）" \
              "签名：自定义证书，与官方不同 —— 安装前请先卸载官方版" \
              "内置权限：QUERY_ALL_PACKAGES" \
              "" \
              "附件名用 ASCII（GitHub 会吃掉中文）：$ASSET 即 微信输入法_${{ steps.apkinfo.outputs.app_version }}_V${{ steps.module.outputs.version }}.apk")"
            gh release create "$TAG" "release/$ASSET" \
              --title "微信输入法 ${{ steps.apkinfo.outputs.app_version }} + 模块 ${{ steps.module.outputs.version }}" \
              --notes "$NOTES"
          fi
          rm -f "release/$ASSET"
          echo "已发布：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

      # ---------- 12. 记录已构建版本，供下次定时任务去重 ----------
      # 只有走到这里（构建+校验+发布都成功）才写，失败时保持旧值，下次会重跑
      - name: Record build state
        if: ${{ success() && steps.dup.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p .state
          printf '%s' "${{ steps.resolve.outputs.version }}.${{ steps.resolve.outputs.build }}_V${{ steps.module.outputs.version }}" > .state/last.txt
          echo "已记录本次构建版本：$(cat .state/last.txt)"
